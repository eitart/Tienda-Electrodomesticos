{% extends "layout.html" %}

{% block titulo %}Iniciar sesión | Mi Portal{% endblock %}

{% block main %}
<div class="flex min-h-[65vh] items-center justify-center">
    <section class="w-full max-w-md rounded-3xl border border-stone-200 bg-white p-8 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">

        <div class="mb-6 flex h-14 w-14 items-center justify-center rounded-2xl bg-marca/10 text-marca">
            <i data-lucide="log-in" class="h-7 w-7"></i>
        </div>

        <h1 class="text-3xl font-bold">Bienvenido</h1>

        <p class="mt-2 text-sm text-stone-500 dark:text-stone-400">
            Ingresa para administrar productos, clientes y ventas.
        </p>

        <form method="POST" action="{{ url_for('login') }}"
              class="mt-8 space-y-5">

            <div>
                <label for="ci" class="mb-2 block text-sm font-medium">
                    CI o usuario
                </label>

                <input id="ci" type="text" name="ci"
                       autocomplete="username" required
                       class="w-full rounded-xl border border-stone-300 bg-stone-50 px-4 py-3 outline-none focus:border-marca focus:ring-2 focus:ring-marca/20 dark:border-zinc-700 dark:bg-zinc-950">
            </div>

            <div>
                <label for="password" class="mb-2 block text-sm font-medium">
                    Contraseña
                </label>

                <input id="password" type="password" name="password"
                       autocomplete="current-password" required
                       class="w-full rounded-xl border border-stone-300 bg-stone-50 px-4 py-3 outline-none focus:border-marca focus:ring-2 focus:ring-marca/20 dark:border-zinc-700 dark:bg-zinc-950">
            </div>

            <button type="submit"
                    class="w-full rounded-xl bg-marca px-5 py-3 font-semibold text-white transition hover:bg-rose-600">
                Iniciar sesión
            </button>
        </form>
    </section>
</div>
{% endblock %}
